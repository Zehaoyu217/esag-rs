[package]
name = "esag"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
libm = "0.2.16"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
rand = "0.10.3"
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
thiserror = "2.0.21"

[dev-dependencies]
approx = "0.5.1"
criterion = "0.8.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false

[profile.bench]
inherits = "release"

[[bench]]
name = "loglik"
harness = false
