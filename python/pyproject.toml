[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "esag"
version = "0.1.0"
description = "ESAG regression for directional data (Rust core): MLE, LASSO family, bootstrap tests, statsmodels-style output"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.21"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
pandas = ["pandas>=1.3"]
test = ["pytest>=7", "pandas>=1.3"]

[tool.maturin]
python-source = "python"
module-name = "esag._esag"
features = ["pyo3/extension-module"]
