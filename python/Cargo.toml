[package]
name = "esag-py"
version = "0.1.0"
edition = "2024"
description = "Python bindings for esag (ESAG regression for directional data)"
license = "MIT"
publish = false

[lib]
name = "_esag"
crate-type = ["cdylib"]

[dependencies]
esag = { path = ".." }
nalgebra = "0.35.0"
numpy = "0.30.0"
rand = "0.10.3"
pyo3 = { version = "0.30.1", features = ["abi3-py39"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
